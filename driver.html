<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PUMPA Driver</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#17202a;
}

header{
    background:#1976b8;
    color:white;
    text-align:center;
    padding:18px 15px;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:520px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    margin-bottom:15px;
}

.dot{
    width:12px;
    height:12px;
    background:#16a34a;
    border-radius:50%;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.start{
    background:#1976b8;
    color:white;
}

.finish{
    background:#e52525;
    color:white;
}

.location{
    background:#f8fafc;
}

.location h2,
.address h2,
.activity h2{
    margin-top:0;
}

.info{
    line-height:1.8;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccd5df;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#1976b8;
}

.next{
    background:#16a34a;
    color:white;
}

.map{
    background:#673ab7;
    color:white;
}

.clear{
    background:#64748b;
    color:white;
}

.activity-box{
    padding:12px;
    background:#f1f5f9;
    border-radius:10px;
    margin-top:10px;
    font-size:14px;
}

.hidden{
    display:none;
}

.message{
    margin-top:12px;
    padding:12px;
    background:#e8f5e9;
    color:#166534;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🚐 PUMPA Driver</h1>
    <p>Bog‘cha transporti haydovchisi</p>
</header>

<div class="container">

    <!-- HOLAT -->
    <div class="card">

        <div class="status">
            <span class="dot"></span>
            <span id="statusText">Yo‘lga tayyor</span>
        </div>

        <button class="start" onclick="startTrip()">
            🚐 YO‘LGA CHIQDIM
        </button>

        <button class="finish" onclick="finishTrip()">
            🏁 YO‘LNI YAKUNLASH
        </button>

        <div id="message"></div>

    </div>


    <!-- JOYLASHUV -->
    <div class="card location">

        <h2>📍 Joylashuv</h2>

        <div class="info">
            Latitude:
            <b id="latitude">Aniqlanmoqda...</b>
            <br>

            Longitude:
            <b id="longitude">Aniqlanmoqda...</b>
            <br>

            GPS holati:
            <b id="gpsStatus">Ruxsat kutilmoqda</b>
        </div>

        <button class="start" onclick="getLocation()">
            📍 JOYLASHUVIMNI ANIQLASH
        </button>

    </div>


    <!-- KEYINGI MANZIL -->
    <div class="card address">

        <h2>➡️ Keyingi manzil</h2>

        <input
            id="address"
            type="text"
            placeholder="Masalan: Sergeli 5-mavze, 12-uy"
        >

        <button class="next" onclick="saveAddress()">
            💾 MANZILNI SAQLASH
        </button>

        <button class="map" onclick="openMap()">
            🗺️ XARITADA OCHISH
        </button>

        <button class="clear" onclick="clearAddress()">
            🗑️ MANZILNI TOZALASH
        </button>

        <div id="savedAddress" class="activity-box hidden"></div>

    </div>


    <!-- FAOLIYAT -->
    <div class="card activity">

        <h2>📋 Faoliyat</h2>

        <div class="activity-box">
            <b>Holat:</b>
            <span id="tripStatus">Boshlanmagan</span>
        </div>

        <div class="activity-box">
            <b>Yo‘l boshlangan vaqt:</b>
            <span id="startTime">—</span>
        </div>

        <div class="activity-box">
            <b>Yo‘l yakunlangan vaqt:</b>
            <span id="finishTime">—</span>
        </div>

    </div>

</div>


<script>

let currentLatitude = null;
let currentLongitude = null;


// ============================
// JOYLASHUV
// ============================

function getLocation(){

    if(!navigator.geolocation){

        document.getElementById("gpsStatus").innerText =
            "GPS qo‘llab-quvvatlanmaydi";

        return;
    }

    document.getElementById("gpsStatus").innerText =
        "Aniqlanmoqda...";

    navigator.geolocation.getCurrentPosition(

        function(position){

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;

            document.getElementById("latitude").innerText =
                currentLatitude.toFixed(6);

            document.getElementById("longitude").innerText =
                currentLongitude.toFixed(6);

            document.getElementById("gpsStatus").innerText =
                "GPS ishlayapti ✅";

        },

        function(error){

            document.getElementById("gpsStatus").innerText =
                "GPS ruxsati kerak ❌";

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );
}


// ============================
// YO‘LNI BOSHLASH
// ============================

function startTrip(){

    let now = new Date();

    let time =
        now.toLocaleString("uz-UZ");

    document.getElementById("statusText").innerText =
        "Yo‘lda 🚐";

    document.getElementById("tripStatus").innerText =
        "Yo‘l boshlandi";

    document.getElementById("startTime").innerText =
        time;

    document.getElementById("finishTime").innerText =
        "—";

    document.getElementById("message").innerText =
        "🚐 Yo‘l boshlandi!";

    localStorage.setItem(
        "pumps_start",
        time
    );

}


// ============================
// YO‘LNI YAKUNLASH
// ============================

function finishTrip(){

    let now = new Date();

    let time =
        now.toLocaleString("uz-UZ");

    document.getElementById("statusText").innerText =
        "Yo‘l yakunlandi";

    document.getElementById("tripStatus").innerText =
        "Yakunlandi";

    document.getElementById("finishTime").innerText =
        time;

    document.getElementById("message").innerText =
        "🏁 Yo‘l muvaffaqiyatli yakunlandi.";

    localStorage.setItem(
        "pumps_finish",
        time
    );

}


// ============================
// MANZILNI SAQLASH
// ============================

function saveAddress(){

    let address =
        document.getElementById("address").value.trim();

    if(address === ""){

        alert("Avval manzilni yozing!");

        return;
    }

    localStorage.setItem(
        "pumps_address",
        address
    );

    showAddress();

}


// ============================
// SAQLANGAN MANZILNI KO‘RSATISH
// ============================

function showAddress(){

    let address =
        localStorage.getItem("pumps_address");

    let box =
        document.getElementById("savedAddress");

    if(address){

        box.innerHTML =
            "📍 <b>Keyingi manzil:</b><br>" +
            address;

        box.classList.remove("hidden");

        document.getElementById("address").value =
            address;

    }

}


// ============================
// XARITANI OCHISH
// ============================

function openMap(){

    let address =
        document.getElementById("address").value.trim();

    if(address === ""){

        address =
            localStorage.getItem("pumps_address");

    }

    if(!address){

        alert("Avval keyingi manzilni kiriting!");

        return;
    }

    let url =
        "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(address);

    window.open(url,"_blank");

}


// ============================
// MANZILNI TOZALASH
// ============================

function clearAddress(){

    localStorage.removeItem("pumps_address");

    document.getElementById("address").value = "";

    document.getElementById("savedAddress")
        .classList.add("hidden");

}


// ============================
// OLDINGI HOLATNI YUKLASH
// ============================

function loadData(){

    let start =
        localStorage.getItem("pumps_start");

    let finish =
        localStorage.getItem("pumps_finish");

    if(start){

        document.getElementById("startTime").innerText =
            start;

    }

    if(finish){

        document.getElementById("finishTime").innerText =
            finish;

        document.getElementById("tripStatus").innerText =
            "Yakunlandi";

        document.getElementById("statusText").innerText =
            "Yo‘l yakunlandi";

    }

    showAddress();

}


// Sahifa ochilganda

loadData();

</script>

</body>
</html>
